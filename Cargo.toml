[workspace]
resolver = "3"
members = ["app", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
focus-core = { path = "crates/focus-core" }
focus-search = { path = "crates/focus-search" }
focus-md = { path = "crates/focus-md" }
focus-ai = { path = "crates/focus-ai" }
focus-ops = { path = "crates/focus-ops" }
focus-graph = { path = "crates/focus-graph" }
focus-kit = { path = "crates/focus-kit" }
focus-i18n = { path = "crates/focus-i18n" }
focus-mcp = { path = "crates/focus-mcp" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rayon = "1"
gpui = "=0.2.2"
gpui-component = "=0.5.1"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
gpui = { path = "vendor/gpui-0.2.2" }
gpui-component = { path = "vendor/gpui-component-0.5.1" }
blade-graphics = { path = "vendor/blade-graphics-0.7.1" }
proc-macro-error2 = { path = "vendor/proc-macro-error2-2.0.1" }
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer-0.3.1" }
