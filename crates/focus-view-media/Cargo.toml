[package]
name = "focus-view-media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
focus-kit.workspace = true
focus-i18n.workspace = true
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
smol = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "tga", "qoi", "pnm", "hdr", "exr", "dds", "ff"] }
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
hayro = "=0.9.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
